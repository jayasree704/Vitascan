name: vitad_ai
description: "VitaD AI – AI-powered Vitamin D test strip analysis application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Design ──────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3

  # ── Camera & Image ───────────────────────────────────────
  image_picker: ^1.1.2
  image: ^4.2.0

  # ── AI / Google Generative AI ────────────────────────────
  google_generative_ai: ^0.4.6

  # ── Supabase ──────────────────────────────────────────────
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.2

  # ── State Management ─────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Local Storage ─────────────────────────────────────────
  shared_preferences: ^2.3.3

  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.8.1

  # ── Networking ───────────────────────────────────────────
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # ── Permissions ──────────────────────────────────────────
  permission_handler: ^11.4.0

  # ── File & PDF ───────────────────────────────────────────
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  # ── Date & Time ──────────────────────────────────────────
  intl: ^0.20.2

  # ── Utils ────────────────────────────────────────────────
  uuid: ^4.5.1
  equatable: ^2.0.7
  logger: ^2.5.0
  cached_network_image: ^3.4.1
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
